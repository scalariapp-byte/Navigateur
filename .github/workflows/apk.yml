name: APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.13" }
      - run: gradle assembleRelease --no-daemon && cp app/build/outputs/apk/release/app-release.apk FanficHub.apk && ls -la FanficHub.apk && echo $GITHUB_RUN_NUMBER > version.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: fanfichub
          name: Fanfic Hub v${{ github.run_number }}
          make_latest: true
          files: |
            FanficHub.apk
            version.txt
