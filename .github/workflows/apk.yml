name: APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v5
        with: { gradle-version: "8.9" }
      - run: gradle assembleDebug --no-daemon && cp app/build/outputs/apk/debug/app-debug.apk Navigateur.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Navigateur (dernière version)
          prerelease: false
          make_latest: true
          files: Navigateur.apk
